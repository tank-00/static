[project]
name = "tariff-interpreter"
version = "0.1.0"
description = "Utility Tariff Interpreter MVP: invoice validation and bounded tariff comparison"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.2",
    "fpdf2>=2.8.9",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "pydantic>=2",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
ai = [
    "anthropic>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tariff_engine", "src/tariff_app"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.169.4",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.0",
    "types-openpyxl>=3.1.5.20260827",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["tests/_probes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PT", "DTZ", "T20"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["tariff_engine", "tariff_app"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tariff_engine.*"
strict = true

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "fpdf.*", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
norecursedirs = ["_probes", ".*", "__pycache__"]
markers = [
    "req(*ids): links a test to requirement/acceptance IDs in docs/requirements.yaml",
    "slow: slower integration tests",
]
filterwarnings = ["error::DeprecationWarning:tariff_engine.*", "error::DeprecationWarning:tariff_app.*"]

[tool.coverage.run]
source = ["src"]
branch = true
