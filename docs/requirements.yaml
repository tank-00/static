# Requirement / acceptance IDs for traceability.
# Backend tests: @pytest.mark.req("ID", ...). Frontend/E2E tests: a `// req: ID` comment in the test file.
# `layer` says which test layer must cover the ID. From S10 on, a conftest hook rejects unknown IDs. S24a's static
# meta-test asserts every backend-layer ID is covered; S33 extends it to the frontend and e2e layers.
# IDs are stable: add new ones rather than renaming.

